<!DOCTYPE html>

<html>

<head>
    <link rel="stylesheet" href="./Style.css">

    <style>
        .imgitem {
            width: 40px;
            height: 40px;
        }

        .par {
            text-align: center;
            font-size: 25px;
            color: rgb(18, 93, 116)
        }

        .itemsdis {
            background-color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 50px;
            width: 202px;
            position: relative;
            margin-bottom: 20px;
            right: -42%;


        }

        .itemsdis2 {
            background-color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 50px;
            width: 202px;
            margin: 30px 100px 30px 30px;
            margin-left: 15%;
            position: relative;
            top: -203px
        }

        .cart {
            background-color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 50px;
            width: auto;
            margin-left: 30px;
            margin-right: 30px;
            margin-top: 30px;
            margin-bottom: 10px;
            border-radius: 20px;
            height: auto;
            border-right: black;
            position: static;
        }

        body {
            background-image: url("./Images/2c1a709ca4ba11c1ba551ea69a685c3b.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
        }

        .barcode {
            border-radius: 20px;
            background-color: rgb(98, 190, 98);
            text-align: center;
        }
    </style>

</head>



<body>

    <header>

        <section class="div">
            <p><strong>SmartCart</strong></p>
            <img src="./Images/3b83549957d066febff448c3aa2a7510.jpg" alt="">

            <nav class="navigation">
                <a href="./Home.html">Home</a>
                <a href="./Demo.html"><b><u>Demo</u></b></a>
                <a href="./Howitwork.html">How the demo works </a>
                <a href="./AboutUs.html">About us </a>
                <a href="./LogIN.html"> Log in</a>
                <a href="./SignUp.html">Sign up</a>

            </nav>
        </section>

    </header>

    <section>
        <h2 style="text-align: center; font-size: 20px">SmartCart Demo<br>(please check out how the demo works first)
        </h2>


        <p class="par">Avaliable items </p>


        <div class="itemsdis">
            <label> <img src="./Images/4a45150d89610c93eb9b8335932296aa.jpg" alt="" class="imgitem">
                Milk

            </label>

            <fieldset class="barcode"> Barcode :111</fieldset>
            <p style="text-align:center; font-size:18px;">Price: 2 SAR</p>
        </div>


        <div class="itemsdis">
            <label> <img src="./Images/c4b5b8b1db82926fbbaf0c49e236cf50.jpg" alt="" class="imgitem">
                Bread

            </label>

            <fieldset class="barcode">Barcode :222</fieldset>
            <p style="text-align:center; font-size:18px;">Price: 1 SAR</p>
        </div>


        <p style="font-size: 25px; margin-left: 50px; font-family: sans-serif;">Add item by barcode</p>

        <form onsubmit="event.preventDefault(); additem();">
            <input required type="text" placeholder="  Enter barcode here "
                style="width:50%; margin-left: 40px; border-radius: 20px; height: 24px; border-color: gray;"
                id="barcode" onkeypress="if(event.key === 'Enter'){ additem(); }">
            <button type="button" onclick="additem()">Add</button>
        </form>


        <div class="cart">
            <h2>Your Cart</h2>


            <p id="totalBox"><strong>Total : 0 SAR</strong></p>
        </div>



    </section>



</body>



</html>
