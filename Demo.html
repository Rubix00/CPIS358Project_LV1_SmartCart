<!DOCTYPE html>

<html>

<head>
    <link rel="stylesheet" href="./Style.css">

    <style>
        .imgitem {
            width: 40px;
            height: 40px;
        }

        .par {
            text-align: center;
            font-size: 25px;
            color: rgb(18, 93, 116)
        }

        .itemsdis {
            background-color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 50px;
            width: 202px;
            margin-top: 15px;
            margin-right: 15%;
            position: relative;
            right: -50%;
            top: 8px;
        }

        .itemsdis2 {
            background-color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 50px;
            width: 202px;
            margin: 30px 100px 30px 30px;
            margin-left: 15%;
            position: relative;
            top: -203px
        }

        .cart {
            background-color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 50px;
            width: auto;
            margin-left: 30px;
            margin-right: 30px;
            margin-top: 30px;
            margin-bottom: 10px;
            border-radius: 20px;
            height: auto;
            border-right: black;
            position: static;
        }

        body {
            background-image:url("./Images/2c1a709ca4ba11c1ba551ea69a685c3b.jpg");
            background-size: cover;       /* Scale to cover the whole page */
            background-repeat: no-repeat; /* Prevent tiling */
            background-position: center;  /* Center the image */
        }

        .barcode {
            border-radius: 20px;
            background-color: rgb(98, 190, 98);
            text-align: center;
        }
    </style>

</head>



<body>

    <header>

        <section class="div">
            <p><strong>SmartCart</strong></p>
            <img src="./Images/3b83549957d066febff448c3aa2a7510.jpg" alt="">

            <nav class="navigation">
                <a href="./Home.html">Home</a>
                <a href="./Demo.html">Demo</a>
                <a href="./Howitwork.html">How the demo works </a>
                <a href="./LogIN.html"> Log in</a>
                <a href="./SignUp.html">Sign up</a>
                <a href="./AboutUs.html">About us </a>
            </nav>
        </section>

    </header>

    <section>
        <h2 style="text-align: center; font-size: 20px">SmartCart Demo<br>(please check out how the demo works first)
        </h2>


        <p class="par">Avaliable items </p>

        <div class="itemsdis">
            <label> <img src="./Images/4a45150d89610c93eb9b8335932296aa.jpg" alt="" class="imgitem">
                Milk

            </label>

            <fieldset class="barcode"> Barcode :111</fieldset>

        </div>


        <div class="itemsdis2">
            <label> <img src="./Images/c4b5b8b1db82926fbbaf0c49e236cf50.jpg" alt="" class="imgitem">
                Bread

            </label>

            <fieldset class="barcode">Barcode :222</fieldset>

        </div>


        <p style="font-size: 25px; margin-left: 50px; font-family: sans-serif;">Add item by barcode</p>

        <form action="">
            <input required type="text" placeholder="  Enter barcode here "
                style="width:50%; margin-left: 40px; border-radius: 20px; height: 24px; border-color: gray;"
                id="barcode">
            <button type="button" onclick="additem()">Add</button>
        </form>


        <div class="cart">
            <h2>Your Cart</h2>


            <p id="totalBox"><strong>Total : 0 SAR</strong></p>
        </div>





    </section>















</body>

<script>
    let total = 0;
    let barcode = null
    function additem() {
        let barcode = document.getElementById("barcode").value;
        let div_C = document.querySelector(".cart");

        let itemName = "";
        let itemPrice = 0;

        if (barcode == "111") {
            itemName = "Milk";
            itemPrice = 2;
        }
        else if (barcode == "222") {
            itemName = "Bread";
            itemPrice = 1;
        }
        else if (barcode == null) {

        }

        total += itemPrice;





        let itemdiv = document.createElement("div");

        itemdiv.innerHTML = ` <p>  ${itemName} -  ${itemPrice} SAR 
    
    <button onclick="removeItem(this , ${itemPrice})"> Remove </button> </p>
    `;
        div_C.appendChild(itemdiv);

        let totalbox = document.getElementById("totalBox")
        totalbox.innerHTML = "<strong> Total: " + total + " SAR </strong>"

        document.getElementById("barcode").value = ""
    }



    function removeItem(button, price) {
        button.parentElement.remove();
        total = total - price;

        let totalbox = document.getElementById("totalBox")
        totalbox.innerHTML = "<strong> Total: " + total + " SAR </strong>"
    }

</script>

</html>
