    .Spage {
      border-radius: 20px;

      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 400px;
      padding: 20px;
      padding-left: 0px;
      margin: 0 auto;
      margin-top: 15%;
      color: black;
      text-align: center;

    }

<body style="background-color: #b7bdba;">
  <header>
    <section class="div">
      <p><strong>SmartCart</strong></p>
      <img src="./Images/3b83549957d066febff448c3aa2a7510.jpg" alt="">

      <nav class="navigation">
        <a href="./Home.html">Home</a>
        <a href="./Demo.html">Demo</a>

        <a href="./SignUp.html">Sign up</a>

      </nav>

  </header>
  <section>

    <div class="Spage">
      <h2> Join us in SmartCart </h2>
      <p class="ftext">Create an Account to experince fast <span style="color: green;">Shopping!</span></p><br><br>


      <form action="./Home.html">
        <label for="name"> Full Name: </label>
        <input style="text-align: center;" type="text" placeholder="Enter your Name here" required id="name"><br><br>

        <label style="text-align: left;" for="email">Email Address: </label>
        <input style="text-align: center;" type="email" placeholder="example@gmail.com" required id="email"><br><br>

        <label for="password">Password: </label>
        <input style="text-align: center;" type="password" placeholder="*******" required id="password"><br><br>

        <label for="confirm">Confirm Password: </label>
        <input style="text-align: center;" type="password" placeholder="Re-Enter your passwrod " requiredid="confirm"><br><br>

        <label for="username">Username: </label>
        <input style="text-align: center;" type="text" placeholder="Enter your username" required id="username"><br><br>

        <button href="./Home.html" type="submit"> Sign in </button>

        <p style="margin-top: 15px; margin-left: 15px;">if you already have an account, click <a
            href="./LogIN.html">here</a> to <b>log in!</b>



        </p>

      </form>
    </div>

  </section>
