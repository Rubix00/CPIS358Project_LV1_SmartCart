<body style="background-color: #b7bdba;">
   <header>

   <div class="Lpage">
      <h2> Log in </h2> <br>


      <form action="./Home.html">


         <label for="username">Username </label>
         <input type="text" placeholder="Enter your username" required id="username"><br><br>

         <label for="password">Password </label>
         <input type="password" placeholder="*******" required id="password"><br><br>



         <button type="submit"> Log in</button>

         <p style="margin-top: 15px; margin-left: 15px;">If you do not have an account, click <a
               href="./SignUp.html">here</a> to <b>sign up!</b>



         </p>

      </form>
   </div>


<script>
    document.getElementById("signupForm").addEventListener("submit", function(event) {
      event.preventDefault(); // stop refresh

      var password = document.getElementById("password").value;
      var confirmPassword = document.getElementById("confirmPassword").value;

      // Reset errors
      document.getElementById("passwordError").innerText = "";
      document.getElementById("confirmError").innerText = "";

      var valid = true;

      // Password validation: >6 chars and at least one uppercase
      if (password.length <= 6 || !/[A-Z]/.test(password)) {
        document.getElementById("passwordError").innerText =
          "Password must be more than 6 characters and contain at least one capital letter.";
        valid = false;
      }

      // Confirm password
      if (confirmPassword !== password) {
        document.getElementById("confirmError").innerText = "Passwords do not match.";
        valid = false;
      }

      if (valid) {
        alert("Signup successful!");
        // Here you would normally send data to server
      }
    });
    </script>
